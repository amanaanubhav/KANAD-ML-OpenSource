services:
  - type: web
    name: kanad-api
    runtime: python
    rootDir: app
    buildCommand: pip install -r requirements.txt && python train_irrigation.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: WEATHER_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://kanad.vercel.app,http://localhost:3000
      - key: PYTHON_VERSION
        value: 3.11.0
